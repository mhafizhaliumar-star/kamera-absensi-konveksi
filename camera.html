<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#18251f"><title>Kamera Absensi</title>
<style>
:root{color-scheme:light;--ink:#18251f;--muted:#647067;--line:#dfe5e0;--bg:#f4f6f4;--accent:#1f6b49}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:560px;margin:0 auto;padding:18px 14px 30px}header{margin:5px 0 18px}h1{font-size:21px;margin:0}.sub,.help{color:var(--muted);font-size:13px;line-height:1.5}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.camera{aspect-ratio:3/4;max-height:65vh;background:#101713;border-radius:13px;overflow:hidden;display:grid;place-items:center;color:#e0e8e2}video,img{width:100%;height:100%;object-fit:cover;display:block}img{display:none}button{width:100%;border:0;border-radius:12px;padding:14px 12px;font:inherit;font-weight:700;margin-top:9px;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#edf1ee;color:var(--ink)}button:disabled{opacity:.5}.msg{font-size:14px;line-height:1.45;margin-top:12px;white-space:pre-wrap}.error{color:#912018}.success{color:#17643a}.hidden{display:none!important}</style>
</head><body><main>
<header><h1>Kamera Absensi</h1><p class="sub">ID karyawan: <strong id="employeeLabel">—</strong></p></header>
<section class="card"><div class="camera"><video id="video" autoplay playsinline muted></video><img id="preview" alt="Pratinjau foto"></div><p class="help">Pastikan wajah terlihat jelas dan pencahayaan cukup. Foto akan dikirim kembali ke portal absensi, lalu dicatat oleh server.</p>
<button id="startBtn" class="secondary">Aktifkan kamera</button><button id="captureBtn" class="primary hidden">Ambil foto</button><button id="retakeBtn" class="secondary hidden">Ambil ulang foto</button><button id="sendBtn" class="primary hidden">Kirim foto ke absensi</button><div id="message" class="msg" role="status"></div></section>
</main><script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const employeeId=(params.get('employeeId')||'').trim().toUpperCase();const returnOrigin=params.get('returnOrigin')||'';let stream=null;let photoDataUrl=null;
$('employeeLabel').textContent=employeeId||'Tidak ditemukan';
function message(t,kind=''){ $('message').textContent=t;$('message').className='msg '+kind; }
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} $('video').srcObject=null;}
async function startCamera(){message('Meminta izin kamera…');try{stopCamera();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}}});$('video').srcObject=stream;$('video').style.display='block';$('preview').style.display='none';$('captureBtn').classList.remove('hidden');$('retakeBtn').classList.add('hidden');$('sendBtn').classList.add('hidden');message('Kamera aktif. Atur posisi wajah, lalu ambil foto.');}catch(e){message('Kamera tidak dapat dibuka. Pastikan situs menggunakan HTTPS dan izin kamera diizinkan. Detail: '+e.message,'error');}}
function capture(){if(!stream||!$('video').videoWidth){message('Kamera belum siap. Tunggu sebentar lalu coba lagi.','error');return;}const canvas=document.createElement('canvas');const video=$('video');const scale=Math.min(1,960/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);photoDataUrl=canvas.toDataURL('image/jpeg',0.72);$('preview').src=photoDataUrl;$('preview').style.display='block';video.style.display='none';$('captureBtn').classList.add('hidden');$('retakeBtn').classList.remove('hidden');$('sendBtn').classList.remove('hidden');stopCamera();message('Periksa hasil foto. Jika sudah sesuai, kirim ke portal absensi.');}
function sendPhoto(){if(!employeeId||!returnOrigin){message('Informasi pengembalian tidak lengkap. Tutup jendela ini dan buka kamera dari portal absensi.','error');return;}if(!photoDataUrl){message('Ambil foto terlebih dahulu.','error');return;}if(!window.opener||window.opener.closed){message('Portal absensi tidak ditemukan. Jangan tutup portal utama; buka ulang halaman kamera dari portal.','error');return;}try{window.opener.postMessage({type:'KONVEKSI_ATTENDANCE_PHOTO',employeeId,photoDataUrl},returnOrigin);$('sendBtn').disabled=true;message('Foto dikirim ke portal absensi. Periksa jendela portal utama untuk status penyimpanan.','success');setTimeout(()=>window.close(),900);}catch(e){message('Gagal mengirim foto ke portal. Detail: '+e.message,'error');}}
$('startBtn').addEventListener('click',startCamera);$('captureBtn').addEventListener('click',capture);$('retakeBtn').addEventListener('click',startCamera);$('sendBtn').addEventListener('click',sendPhoto);window.addEventListener('pagehide',stopCamera);
if(!employeeId||!returnOrigin){$('startBtn').disabled=true;message('Halaman ini harus dibuka dari tombol “Buka halaman kamera” pada portal absensi.','error');}
</script></body></html>
